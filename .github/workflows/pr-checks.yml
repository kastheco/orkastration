name: PR checks

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # test_an_absence_check_passes_on_its_own_expected_exit runs a real
      # `rg` and asserts on its exit status. ripgrep is not on the runner
      # image, so without this the command exits 127 and the test reads a
      # missing binary as a failing absence check.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: pytest
        run: uv run pytest

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: ruff check
        run: uv run ruff check --output-format=concise .

  # mypy reports 77 standing errors on main, all in test modules. The job runs so
  # the count is visible and cannot grow unnoticed, and it does not gate, because
  # a check nothing can pass is not a gate. It is named in
  # `final_gate.advisory_checks` so the supervisor enforces the same set this
  # workflow does (KAS-611: declared beats inferred).
  mypy:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: mypy
        run: uv run mypy

  extension:
    name: Pi extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm install --ignore-scripts
      - name: typecheck
        run: npm run typecheck
      - name: extension tests
        run: npm run test:extension
