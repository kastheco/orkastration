version: 2
max_parallel_lanes: 6
max_parallel_workers: 6

review_cycle:
  initial_scope: lane_changeset
  freeze_findings_after_initial_review: true
  max_fix_rounds_per_finding: 2

  re_review_scope:
    - finding_contract
    - relevant_original_context
    - fixer_diff
    - validation_evidence

  new_findings_during_re_review:
    introduced_by_fix: accept
    otherwise: defer_to_next_review_run

  scope:
    escape: stop_and_escalate
    reject_out_of_scope_diff: true
    required_boundary: paths
    symbols: enforce_when_adapter_available

  parallel_fixers:
    max_per_lane: 3
    workspace: isolated_from_review_revision
    require_disjoint_write_scopes: true
    on_overlap: serialize
    integration: serial

  escalation:
    agent: codex
    model: gpt-5.6-sol
    strength: high
    fast: true

roles:
  worker:
    agent: codex
    model: gpt-5.6-sol
    strength: medium
    fast: true

  initial_reviewer:
    agent: claude
    model: opus
    strength: high
    fast: true

  fixer:
    agent: codex
    model: gpt-5.6-luna
    strength: high
    fast: true
    fallback:
      agent: codex
      model: gpt-5.6-terra
      strength: high
      fast: true
      trigger: capability_mismatch

  re_reviewer:
    agent: claude
    model: sonnet
    strength: medium
    fast: true

publication:
  authorized_by: graph_acceptance
  scope: accepted_run
  branch:
    create: true
    push: true
    force_push: false
  pull_request:
    create_or_update: true
    initial_state: draft
    mark_ready_after_final_gate: true
  merge: true
  deploy: false

final_gate:
  type: ci
  provider: auto
  repository: lane_repository
  run_on: integrated_fix_set
  require_remote: true
  require_all_checks: true
  restart_initial_review: false
  # Leave a non-concluding pull request open instead of silently advancing it.
  timeout_seconds: 900
  # kashh's own `all-checks` job deletes this suite from the set it requires
  # while its launch boundary is intermittent (.github/workflows/pr-checks.yml).
  # Name it here so the supervisor enforces the same set the repository does.
  #
  # This repository's own `mypy (advisory)` job is the same shape: it runs so the
  # standing error count stays visible, and it does not gate, because a check
  # nothing on main can pass is not a gate.
  advisory_checks:
    - packages/browser Chrome conformance (advisory)
    - mypy (advisory)

  on_failure:
    create_scoped_finding: true
    scope_source:
      - failing_check
      - failure_output
      - implicated_fix_commits
    max_fix_rounds: 2
    scope_escape: stop_and_escalate

# How long a dispatched stage may run before that is itself worth reporting.
# `soft_minutes` only says so: it writes a `stage_overdue` event and puts the
# stage in `monitor`'s `overdue` list. Nothing is released and nothing is failed,
# because a slow agent and a wedged one look identical from outside.
#
# `hard_minutes` releases the worker terminal, which returns the Orca Task to
# READY and lets the stage be dispatched again. It is deliberately unset here
# until these soft numbers have been calibrated against real runs — a hard
# budget guessed too low turns a slow machine into a re-dispatch loop.
stage_budgets:
  worker: {soft_minutes: 45}
  initial_reviewer: {soft_minutes: 20}
  fixer: {soft_minutes: 20}
  re_reviewer: {soft_minutes: 15}
  escalation: {soft_minutes: 15}
