[project]
name = "kasgraph"
version = "0.1.0"
description = "Typed execution-graph controller for Orca-managed agent lanes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "pydantic-evals>=2.0,<3",
    "pyyaml>=6.0,<7",
    "sqlmodel>=0.0.39,<0.1",
    "typer>=0.21,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<1",
    "types-pyyaml>=6.0,<7",
]

[project.scripts]
kasgraph = "kasgraph.cli:app"
kasgraph-eval = "evals.planner:main"

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kasgraph", "evals"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=kasgraph --cov-report=term-missing --cov-fail-under=90"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "evals", "tests"]

[tool.pyright]
reportUnusedVariable = "none"
reportUnusedCallResult = "none"
